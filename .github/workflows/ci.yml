name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（Windows / Node ${{ matrix.node }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 单元测试不需要 Electron 二进制，跳过 188MB 下载以加快 CI
      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # 界面多语言：代码里用到的 key 在 en / vi 词典里都要有；两份词典 key 一致、
      # {占位符} 与 HTML 标签与中文原文一致、没有空译文（npm test 里的 i18n-test 也会覆盖）
      - name: 多语言词典检查
        run: npm run check:i18n

      - name: 运行测试
        run: npm test

      # 直接驱动 agent.ps1 内嵌 C# 的钩子回调，防止键位映射被改坏
      - name: 鼠标钩子逻辑冒烟测试
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $out = & .\test\pointer-hook-logic.ps1
          $out | ForEach-Object { Write-Host $_ }
          if (-not ($out -contains 'POINTER_HOOK_LOGIC_OK')) { exit 1 }

  ui-i18n:
    # 真实 Electron 渲染（主进程 IPC 为 mock，不含安卓运行时）：中文 / English / Tiếng Việt
    # × 默认尺寸 / 最小窗口 × 100% / 150% / 200% 缩放，检查文字被裁切、按钮文字溢出、横向滚动条。
    # 截图作为 artifact 上传，便于人工复核。
    name: 界面多语言布局（Electron）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（含 Electron）
        run: npm ci

      - name: 布局检查
        run: npm run test:ui-i18n

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-layout-screenshots
          path: test/out/i18n-layout/
          if-no-files-found: ignore
