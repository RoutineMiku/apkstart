name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建便携版并发布
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（含 Electron 运行时）
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 测试
        run: npm test

      - name: 打包便携版
        run: npm run pack

      # 用 7-Zip 而不是 Compress-Archive：同一个目录，.NET deflate 压出来 105MB，
      # 7-Zip -mx=9 只要 99.6MB —— 差这 5MB 就决定 Gitee 上放的是「一个能直接解压的
      # zip」还是「两个必须手工拼接的 part」。build/zip.js 还带体积闸门：超过
      # 100MiB 直接让 job 失败，避免以后又悄悄退回分片包。
      - name: 压缩产物（7-Zip，体积闸门 100MiB）
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          node build/zip.js dist/ApkStart-win64-portable "ApkStart-$tag-win64-portable.zip" --limit-mb 100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "ApkStart-$tag-win64-portable.zip" | Select-Object Name, Length

      # 创建 Release 并上传轻量便携版（壳层极小，运行时首次启动按需下载）
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkStart-$tag-win64-portable.zip"
          # 幂等：release 已存在（如重跑 / 重推 tag）就跳过 create，只上传资产
          $existing = gh release view $tag --json tagName -q .tagName 2>$null
          # 有手写的发版说明就用它（.github/release-notes-<tag>.md），比 --generate-notes
          # 的「Full Changelog」有用得多；没有才退回自动生成。
          $notes = ".github/release-notes-$tag.md"
          if (-not $existing) {
            if (Test-Path $notes) {
              gh release create $tag --title "ApkStart $tag" --notes-file $notes
            } else {
              gh release create $tag --title "ApkStart $tag" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 15 }
          }
          if (-not $ok) { Write-Error "上传失败: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[].name'

      # 同步到 Gitee：国内直连 GitHub 只有几十 KB/s，Gitee 通常能跑几 MB/s。
      # 便携包压紧后约 99.6MB，在 Gitee 单文件上限（100MB）以内，直接放一个整包，
      # 用户点开就能解压；只有超限时 publish-gitee.js 才退回 .part1/.part2 分片。
      # Setup（1.4GB）与运行时整包（1.4GB）超限太多，只留在 GitHub ——
      # 应用端对「哪个源有资产」是取并集的，不影响更新。
      - name: 同步便携版到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:GITEE_TOKEN) { Write-Output "未配置 GITEE_TOKEN，跳过 Gitee 同步"; exit 0 }
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          node tools/publish-gitee.js $tag --zip "ApkStart-$tag-win64-portable.zip"

  full:
    name: 构建完整版（内置运行时，离线开箱即用）
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # 从 Google 官方源组装运行时（emulator + platform-tools + aehd + Play x86_64 镜像）。
      # 输出到 engine/，与本地开发时的目录结构一致。
      - name: 组装运行时
        run: node build/fetch-runtime.js engine

      # prepare-runtime 会把 system.img/vendor.img 压成 xz(LZMA2)。
      # CI runner 只有 2 核：XZ_PRESET=6 把压缩时间从 ~2h 降到 ~40min（体积 +3%）。
      # XZ_TIMEOUT_MS 是看门狗：超时自动 kill 并落 gzip 兜底，
      # 绝不重演「stdin 没接 EOF → 0 字节输出 → 挂死 3 小时」。
      - name: 准备运行时（xz 压缩，CI 降档加速）
        run: node build/prepare-runtime.js --force
        env:
          XZ_PRESET: '6'
          XZ_TIMEOUT_MS: '3600000'

      # 内置微软 VC++ 2015-2022 x64 运行库：安卓模拟器（Qt6）与 qemu 都依赖它，
      # 缺了在「其他电脑」上会直接起不来（0xc0000135 / MSVCP140 缺失）。
      # 放到 build/runtime 内，随 extraResources 一起打进安装包；离线也能一键安装。
      - name: 下载 VC++ 运行库（离线内置）
        shell: pwsh
        run: |
          $dir = "build\runtime"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          $out = "$dir\vc_redist.x64.exe"
          Write-Output "下载 VC++ 2015-2022 x64 运行库…"
          curl.exe -L -o $out "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1MB) { Write-Error "vc_redist 下载失败" }
          Get-Item $out | Select-Object Name, Length

      # 不打 git tag 时 electron-builder 不会隐式发布；打了 tag 也会因为本 job 没有
      # GH_TOKEN 而报 "GitHub Personal Access Token is not set" 后退出 1（之前完整版一直失败的根因）。
      # 这里显式 --publish never，安装包由后面「上传完整版到 Release」步骤用 gh release upload 上传。
      - name: 构建完整版安装包
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传完整版到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $setup = Get-ChildItem dist/release/*Setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "未找到 Setup.exe"; exit 1 }
          Write-Output ("上传 {0} ({1:N0} MB)" -f $setup.Name, ($setup.Length / 1MB))
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $setup.FullName --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "上传失败: $($setup.Name)"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'

      # 轻量版（不带运行时）不再去 dl.google.com 逐个下 emulator / 系统镜像，
      # 而是直接下这一个整包 —— 下载源与「软件更新」同为本项目 GitHub Release，
      # 国内网络稳定性、出问题后的排障都只在一个地方。
      # 内容已经是 .xz 压缩过的镜像，这里用 bsdtar 直接打 zip（不再二次压缩，省几十分钟）。
      - name: 打包运行时整包（轻量版下载源）
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkStart-runtime-$tag.zip"
          if (-not (Test-Path "build\runtime\emulator\emulator.exe")) { Write-Error "build\runtime 不完整"; exit 1 }
          tar.exe -a -cf $zip -C "build\runtime" .
          if ($LASTEXITCODE -ne 0) { Write-Error "打包运行时失败"; exit 1 }
          Get-Item $zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传运行时整包到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkStart-runtime-$tag.zip"
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "上传失败: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'
