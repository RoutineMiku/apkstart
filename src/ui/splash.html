<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>ApkStart</title>
<link rel="stylesheet" href="splash.css" />
</head>
<body>
<div class="splash" id="splash">
  <!-- 极简苹果风氛围层：柔和光晕，缓慢呼吸 -->
  <div class="aura" aria-hidden="true"></div>
  <div class="halo" aria-hidden="true"></div>

  <!-- Logo 区域 -->
  <div class="logo-wrap">
    <div class="logo-glow" aria-hidden="true"></div>
    <img class="logo" id="logo" src="assets/logo.png" alt="ApkStart" draggable="false" />
    <div class="brand">ApkStart</div>
    <div class="tagline"><span data-i18n="v058.m0218">Windows 上的安卓应用运行器</span></div>
  </div>

  <!-- 进度条 -->
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- 状态文字 -->
  <div class="status" id="status"><span data-i18n="v058.m0219">正在准备…</span></div>

  <!-- 首次安装提示（默认隐藏，由主进程控制显示） -->
  <div class="first-run" id="firstRun" hidden>
    <div class="first-run-title" id="firstRunTitle"><span data-i18n="v058.m0220">首次使用 · 自动配置中</span></div>
    <ul class="first-run-list" id="firstRunList">
      <li><span data-i18n="v058.m0221">下载 Android 运行时引擎（约 200MB，只需一次）</span></li>
      <li><span data-i18n="v058.m0222">下载系统镜像（约 1.5GB，只需一次）</span></li>
      <li><span data-i18n="v058.m0223">配置硬件加速与网络</span></li>
      <li><span data-i18n="v058.m0224">完成后即可双击 APK 或桌面图标秒开应用</span></li>
    </ul>
  </div>

  <!-- 底部版权 -->
  <div class="footer">Powered by RoutineMiku · v<span id="ver"></span></div>
</div>

<script src="i18n.js"></script>
<script src="splash.js"></script>
</body>
</html>
