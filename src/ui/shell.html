<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>ApkStart</title>
<link rel="stylesheet" href="shell.css" />
</head>
<body>
<header class="bar" id="bar">
  <img class="ico" id="appIcon" alt="" draggable="false" />
  <span class="name" id="appName">应用</span>
  <span class="grow"></span>
  <button class="ctl" id="btnRotate" title="横屏 / 竖屏（Ctrl+R）">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8V6a2 2 0 0 1 2-2h8"/><path d="M17.5 1.5 21 5l-3.5 3.5"/>
      <path d="M20 16v2a2 2 0 0 1-2 2H10"/><path d="M6.5 22.5 3 19l3.5-3.5"/>
    </svg>
  </button>
  <button class="ctl" id="btnMin" title="最小化">
    <svg viewBox="0 0 12 12" width="11" height="11"><rect x="2" y="5.4" width="8" height="1.2" fill="currentColor"/></svg>
  </button>
  <button class="ctl" id="btnMax" title="最大化">
    <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="2.2" y="2.2" width="7.6" height="7.6"/></svg>
  </button>
  <button class="ctl close" id="btnClose" title="关闭">
    <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2.4 2.4 9.6 9.6M9.6 2.4 2.4 9.6"/></svg>
  </button>
</header>

<main class="stage" id="stage">
  <div class="boot" id="boot">
    <img class="boot-ico" id="bootIcon" alt="" draggable="false" />
    <div class="boot-name" id="bootName"></div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-tip" id="bootTip">正在启动安卓运行时…</div>
  </div>
</main>

<script src="shell.js"></script>
</body>
</html>
